<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>仮キャラクター プレビュー</title>
<style>
  html, body { margin: 0; background: #111; }
  #c { width: 1080px; height: 1920px; }
</style>
</head>
<body>
<!-- 使い方: character.html?state=heart  /  写真モード: character.html?state=talk&photo=assets/person-cutout.png -->
<div id="c"></div>
<script type="module">
  import { createCharacter, STATES } from './js/character.js';
  const q = new URLSearchParams(location.search);
  const state = q.get('state') || 'idle';
  const noMouth = q.get('mouth') === 'none';
  const photo = q.get('photo') || null;
  const ch = createCharacter(document.getElementById('c'), { photo });
  // 写真の読み込みを待ってからコマ撮りする
  window.ready = photo ? new Image().decode.call(Object.assign(new Image(), { src: photo })).catch(() => {}) : Promise.resolve();
  window.renderAt = (t) => ch.render(state, t, noMouth ? { mouth: null } : {});
  window.STATES = STATES;
  if (q.get('play') !== '0') {
    const start = performance.now();
    const loop = () => {
      const d = STATES[state].duration;
      window.renderAt(((performance.now() - start) / 1000) % d);
      requestAnimationFrame(loop);
    };
    loop();
  } else {
    window.renderAt(0);
  }
</script>
</body>
</html>
