<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIキャラ配信画面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="overlay.css">
</head>
<body>
<!-- OBS: ブラウザソース 幅1080 高さ1920 / 「OBSで音声を制御する」にチェック -->
<div id="stage">
  <div id="video"></div>
  <img id="mouth" alt="">
  <div id="hud">
    <div id="likes" class="glass">
      <span class="heart">❤</span><b>いいね</b><span id="likes-num">0/10,000</span>
      <div class="bar"><i id="likes-bar"></i></div>
    </div>
    <div id="ai-chip">AIキャラクター配信</div>
    <div id="clock"><div id="time">--:--</div><div id="date"></div></div>

    <div id="menu" class="glass"></div>

    <div id="goal" class="glass">
      <div class="goal-head"><span id="goal-icon">🌹</span><b id="goal-label">今日のバラ</b><span id="goal-num">0/10000</span></div>
      <div class="bar"><i id="goal-bar"></i></div>
      <ol id="rank-list"></ol>
      <div class="counter"><span id="counter-icon">💗</span><b id="counter-label">ハートミー</b><span id="counter-num">0個</span></div>
    </div>

    <div id="comment-card" class="glass card">
      <div class="card-head"><b id="c-user"></b><span id="c-kind">コメント</span></div>
      <div id="c-text" class="muted">コメントを待っています</div>
    </div>

    <div id="reply-card" class="glass card">
      <div class="card-head"><b><span id="r-name"></span><span class="ai">AI</span></b><span id="r-to"></span></div>
      <div id="r-text"></div>
      <div class="card-foot"><div id="wave"></div><span id="voice-label"></span></div>
      <div id="disclosure"></div>
    </div>

    <button id="audio-unlock" class="hidden">クリックして音声をON</button>
    <div id="conn" class="hidden">サーバー未接続</div>
  </div>
</div>
<script type="module" src="js/overlay.js"></script>
</body>
</html>
